mode: center_eval    # custom, train, train_all, test, inference, tryout, preprocessing, gt_extraction, center_eval


train:
  batch_size: 1 # 8, 6 12
  epochs: 600  # 400, 600, 50
  learning_rate: 0.0001  # 1e-4
  exp_name: "seg_final_comp_std_norm"  # teb7, mb5, r101, r101_32x32d, d161, mos4
  # "final_comp_std_norm"

test:
  batch_size: 5

preprocessing:
  file_ending: ".h5"  # ".h5", ".ply"

gt_extraction:
    generate_2d_gt_maps: False
    names: ["whu", "sud"]
    data_paths: ["F:/Fraunhofer_Backup/data/whu3d-dataset-wo-test-label", "F:/Fraunhofer_Backup/data/SUD-ROAD"]
    # ["C:/Users/tippolito/Data/whu3d-dataset-wo-test-label", "C:/Users/tippolito/Data/SUD-ROAD"]  
    # ["/data/whu3d-dataset-wo-test-label", "/data/SUD-ROAD"]
    # ["F:/Fraunhofer_Backup/data/whu3d-dataset-wo-test-label", "F:/Fraunhofer_Backup/data/SUD-ROAD"]
    save_path: "./output"  # "F:/Fraunhofer_Backup/data/"  # "/out/checkpoints/2d/output"  # "/out/data/"  # "F:/Fraunhofer_Backup/data/"
    # "/data/" "./output/" # "/data/2d_gt_patches"  "./output/"
    # rm -rf ../data/2d_gt_patches && mkdir ../data/2d_gt_patches && chmod -R 777 ../data/2d_gt_patches
    # "./mcr_maps" # "./output/eval_ground_truths_mean.json"
    center_algorithm: "squares"    # "squares", "mean", "ransac", "mesqra"
    debugging_path: "./output"  # None or "/path"

center_eval:
    center_extraction_method: "edge_peak_maxima"
    # "polygon_centroid", "circle_least_squares", "peak_maxima"
    #    2D:
    #     # for segmentations
    #     "polygon_centroid": extract_center_polygon_centroid,
    #     "circle_least_squares": extract_center_circle_least_squares,
    #     "hough_least_squares": extract_center_hough_least_squares,
    #     "ellipse_fit": extract_center_ellipse_fit,
    #     "distance_transform": extract_center_distance_transform,
    #     "least_square_radius": extract_center_least_square_radius,

    #     # for heatmaps
    #     "intensity_weighted_center": extract_center_intensity_weighted,
    #     "peak_maxima": extract_center_peak_maxima,
    #     "edge_peak_maxima":extract_edge_aware_maxima_peak,
    #     "template_matching":extract_center_template_matching,
    #
    #    3D:
    #     "polygon_centroid_3d": extract_3d_center_polygon_centroid,               # Basic Mean
    #     "bbox_median_z": extract_3d_center_bbox_median,                       # Better: ignores density bias & Z-noise
    #     "pca_plane_circle_least_squares": extract_3d_center_pca_plane_circle 
    center_pred_path: "./output/center_preds"
    save_debug_plots: False
    gt_json_file_paths: ["F:/src/MCR-Lab/output/center_gt/center_ground_truth_whu_test_squares.json", "F:/src/MCR-Lab/output/center_gt/center_ground_truth_sud_test_squares.json"]
    min_input_points: 1000    # -1 to deactivate
    min_confidences: [0.05, 0.1, 0.3, 0.5, 0.7, 0.9, 0.95, 0.99]  # [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.75, 0.8, 0.85, 0.9, 0.95]  # [0.1, 0.5, 0.9]
    min_confidence_peak: 0.4
    candidate_min_points: 200
    # run_in_only_pred_save_mode: True
    # pred_save_mode_saving_name: "2D_Seg_UNet_Segformer"
    run_mode: "load"  # save, load, normal (everything else)
    pred_save_load_mode_saving_name: "HEATMAP_UNET_EFFICIENTNET"
    pred_save_load_mode_saving_path: "F:/Fraunhofer_Backup/saved_final_preds"  # "./saved_preds"
    clear_pred_save_load_only_model_folder: False
    clear_pred_save_load_folder: False
    process_3d_mode: "2d"   # 2d for projection or 3d for native usage, but choose extraction method carefully

inference:
  checkpoint_path: "./output/checkpoint/2026_06_22_20_31_unet/checkpoint-1196/model.safetensors"
  save_path: "./output/inference/eval_preds.json"

